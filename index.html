<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابات إدارة السيارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ea;--card:#fff;--ink:#14302c;--mute:#5d6e6a;--line:#d6dbd3;--in:#1f7a4d;--out:#b3402a;--ac:#14302c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b19;--card:#172826;--ink:#e8efe9;--mute:#97aaa4;--line:#2a3f3b;--in:#5fcf93;--out:#f08a72;--ac:#e8efe9}}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:14px;max-width:680px;margin-inline:auto}
h1{font-size:1.3rem;font-weight:800;margin:6px 0 12px}
h2{font-size:1rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--mute);margin:9px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:var(--bg);font-weight:600}
button.g{background:transparent;color:var(--mute);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.full{width:100%;margin-top:12px}
.msg{color:var(--out);font-size:.85rem;min-height:1.2em;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top span{font-size:.8rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:1.1rem}.sum small,.mute{color:var(--mute);font-size:.8rem}
.in{color:var(--in)}.out{color:var(--out)}
.it{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}.it small{display:block;color:var(--mute)}
.amt{font-weight:800;white-space:nowrap}
.x{padding:0 8px;background:none;color:var(--mute);font-size:1.1rem}
.empty{color:var(--mute);text-align:center;padding:16px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px 4px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--in)}
.hide{display:none}
.click{cursor:pointer}
.mh{display:flex;justify-content:space-between;font-weight:800;padding:12px 0 4px;margin-top:6px;border-bottom:2px solid var(--line)}
h2.s{margin:2px 0 6px}
details summary{cursor:pointer;color:var(--mute);font-size:.85rem;margin-top:10px}
</style>
</head>
<body>
<h1>حسابات إدارة السيارات</h1>

<div id="authBox" class="card hide">
  <div class="tabs"><button id="tL" type="button">دخول</button><button id="tR" type="button" class="g">حساب جديد</button></div>
  <label for="email">البريد الإلكتروني</label><input id="email" type="email" dir="ltr" autocomplete="email">
  <label for="pass">كلمة المرور (6 حروف على الأقل)</label><input id="pass" type="password" dir="ltr">
  <button id="authBtn" class="full" type="button">دخول</button>
  <div id="authMsg" class="msg"></div>
</div>

<div id="app" class="hide">
  <div class="card top"><span id="who"></span><button id="logout" class="g" type="button">خروج</button></div>
  <div class="tabs" id="nav">
    <button data-t="ops" type="button">العمليات</button>
    <button data-t="cars" type="button" class="g">السيارات</button>
    <button data-t="plans" type="button" class="g">الأقساط</button>
  </div>

  <!-- العمليات -->
  <section id="t-ops">
    <div class="card">
      <h2>عملية جديدة</h2>
      <div class="row">
        <div><label for="type">النوع</label><select id="type"><option value="out">مصروف</option><option value="in">دخل</option></select></div>
        <div><label for="cat">التصنيف</label><select id="cat"></select></div>
      </div>
      <div class="row">
        <div><label for="car">السيارة</label><select id="car"></select></div>
        <div><label for="amount">المبلغ</label><input id="amount" type="number" inputmode="decimal" min="0" step="any"></div>
      </div>
      <div class="row">
        <div><label for="date">التاريخ</label><input id="date" type="date"></div>
        <div><label for="km">عداد الكيلومترات</label><input id="km" type="number" inputmode="numeric" min="0"></div>
      </div>
      <label for="vendor">الورشة / المورد / العميل</label><input id="vendor">
      <label for="desc">البيان والتفاصيل</label><textarea id="desc" rows="2" placeholder="مثال: تغيير زيت وفلتر + تبديل تيل فرامل أمامي"></textarea>
      <button id="add" class="full" type="button">حفظ العملية</button>
      <div id="addMsg" class="msg"></div>
    </div>
    <div class="card">
      <div class="row">
        <div><label for="fCar">فلتر السيارة</label><select id="fCar"></select></div>
        <div><label for="fMon">الشهر</label><input id="fMon" type="month"></div>
      </div>
      <label for="q">بحث (بيان، ورشة، تصنيف، سيارة، مبلغ)</label>
      <input id="q" type="search" placeholder="اكتب أي كلمة...">
      <div class="sum" style="margin-top:12px">
        <div><small>الدخل</small><b class="in" id="tIn">0</b></div>
        <div><small>المصروفات</small><b class="out" id="tOut">0</b></div>
        <div><small>الصافي</small><b id="tNet">0</b></div>
      </div>
    </div>
    <div class="card" id="opsList"></div>
  </section>

  <!-- السيارات -->
  <section id="t-cars" class="hide">
    <div class="card">
      <h2>إضافة سيارة</h2>
      <label for="cName">الاسم أو الموديل</label><input id="cName" placeholder="مثال: لانسر 2018">
      <div class="row">
        <div><label for="cPlate">رقم اللوحة</label><input id="cPlate"></div>
        <div><label for="cPrice">سعر الشراء</label><input id="cPrice" type="number" inputmode="decimal" min="0"></div>
      </div>
      <div class="row">
        <div><label for="cDate">تاريخ الشراء</label><input id="cDate" type="date"></div>
        <div><label for="cDriver">السائق</label><input id="cDriver"></div>
      </div>
      <label for="cNote">ملاحظات (ترخيص، تأمين، لون...)</label><input id="cNote">
      <button id="addCar" class="full" type="button">حفظ السيارة</button>
      <div id="carMsg" class="msg"></div>
    </div>
    <input id="qc" type="search" placeholder="ابحث في السيارات (اسم، لوحة، سائق)..." style="margin-bottom:12px">
    <div id="carList"></div>
  </section>

  <!-- الأقساط -->
  <section id="t-plans" class="hide">
    <div class="card">
      <h2>إضافة قسط</h2>
      <label for="pTitle">اسم القسط</label><input id="pTitle" placeholder="مثال: قسط لانسر - بنك مصر">
      <label for="pCar">السيارة</label><select id="pCar"></select>
      <div class="row">
        <div><label for="pMonthly">القسط الشهري</label><input id="pMonthly" type="number" inputmode="decimal" min="0"></div>
        <div><label for="pCount">عدد الأقساط</label><input id="pCount" type="number" inputmode="numeric" min="1"></div>
      </div>
      <div class="row">
        <div><label for="pStart">تاريخ أول قسط</label><input id="pStart" type="date"></div>
        <div><label for="pPaid">اتدفع منها قبل كده</label><input id="pPaid" type="number" inputmode="numeric" min="0" value="0"></div>
      </div>
      <button id="addPlan" class="full" type="button">حفظ القسط</button>
      <div id="planMsg" class="msg"></div>
    </div>
    <input id="qp" type="search" placeholder="ابحث في الأقساط (اسم القسط، سيارة)..." style="margin-bottom:12px">
    <div id="planList"></div>
  </section>

  <!-- صفحة السيارة -->
  <section id="t-car" class="hide">
    <button id="back" class="g" type="button" style="margin-bottom:12px">← رجوع للسيارات</button>
    <div class="card" id="carHead"></div>
    <div class="card">
      <div class="row">
        <div><label for="cMon">الشهر</label><input id="cMon" type="month"></div>
        <div><label for="cq">بحث</label><input id="cq" type="search" placeholder="بيان، ورشة، تصنيف..."></div>
      </div>
      <div class="sum" style="margin-top:12px">
        <div><small>الدخل</small><b class="in" id="cIn">0</b></div>
        <div><small>المصروفات</small><b class="out" id="cOut">0</b></div>
        <div><small>الصافي</small><b id="cNet">0</b></div>
      </div>
    </div>
    <div class="card" id="carCats"></div>
    <div id="carPlans"></div>
    <div class="card" id="carOps"></div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, query, orderBy, onSnapshot, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtCE0MWX-biwiRiVE3e8nNXhK-NnUioAo",
  authDomain: "car-managementt.firebaseapp.com",
  projectId: "car-managementt",
  storageBucket: "car-managementt.firebasestorage.app",
  messagingSenderId: "913928572478",
  appId: "1:913928572478:web:88bd0dc5aae788206f0b6f",
  measurementId: "G-H83XN123G1"
};
const fb = initializeApp(firebaseConfig), auth = getAuth(fb), db = getFirestore(fb);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n || 0).toLocaleString("ar-EG", {maximumFractionDigits: 2});
const today = () => new Date().toISOString().slice(0, 10);
const errs = {
  "auth/invalid-credential":"البريد أو كلمة المرور غلط", "auth/invalid-email":"البريد الإلكتروني غير صحيح",
  "auth/email-already-in-use":"البريد ده مسجل قبل كده، جرب الدخول", "auth/weak-password":"كلمة المرور لازم 6 حروف على الأقل",
  "auth/operation-not-allowed":"فعّل Email/Password من Authentication", "auth/unauthorized-domain":"ضيف دومين الموقع في Authorized domains",
  "permission-denied":"مفيش صلاحية: راجع Security Rules في Firestore"
};
const em = e => errs[e.code] || e.message;

const CATS = {
  out: ["صيانة","قطع غيار","زيت وفلاتر","إطارات","وقود","أقساط","تأمين","ترخيص","مخالفات","سائق / راتب","غسيل","إكسسوارات","أخرى"],
  in: ["إيجار / تشغيل","توصيل","بيع سيارة","أخرى"]
};
let uid = null, curCar = null, cars = [], entries = [], plans = [], unsubs = [];
const carName = id => { const c = cars.find(x => x.id === id); return c ? c.name + (c.plate ? " (" + c.plate + ")" : "") : "بدون سيارة"; };

// ---- دخول ----
let mode = "L";
const setMode = m => { mode = m; $("tL").className = m==="L" ? "" : "g"; $("tR").className = m==="R" ? "" : "g"; $("authBtn").textContent = m==="L" ? "دخول" : "إنشاء الحساب"; $("authMsg").textContent = ""; };
$("tL").onclick = () => setMode("L"); $("tR").onclick = () => setMode("R");
$("authBtn").onclick = async () => {
  $("authMsg").textContent = "";
  try { const e = $("email").value.trim(), p = $("pass").value;
    mode === "L" ? await signInWithEmailAndPassword(auth, e, p) : await createUserWithEmailAndPassword(auth, e, p);
  } catch (err) { $("authMsg").textContent = em(err); }
};
$("logout").onclick = () => signOut(auth);

// ---- تبويبات ----
function showTab(t, nav) {
  ["ops","cars","plans","car"].forEach(k => $("t-"+k).classList.toggle("hide", k !== t));
  [...$("nav").children].forEach(b => b.className = b.dataset.t === (nav || t) ? "" : "g");
}
$("nav").onclick = e => { const t = e.target.dataset.t; if (t) { curCar = null; showTab(t); } };
$("back").onclick = () => { curCar = null; showTab("cars"); };
$("cMon").onchange = () => renderCar();
$("cq").oninput = () => renderCar();

// ---- قوائم الاختيار ----
function fillCats() { $("cat").innerHTML = CATS[$("type").value].map(c => `<option>${c}</option>`).join(""); }
$("type").onchange = fillCats;
function fillCarSelects() {
  const opts = '<option value="">بدون سيارة</option>' + cars.map(c => `<option value="${c.id}">${esc(carName(c.id))}</option>`).join("");
  for (const id of ["car","pCar"]) { const v = $(id).value; $(id).innerHTML = opts; $(id).value = v; }
  const v = $("fCar").value;
  $("fCar").innerHTML = '<option value="all">كل السيارات</option>' + opts.replace("بدون سيارة", "عمليات بدون سيارة").replace('value=""', 'value="none"');
  $("fCar").value = v || "all";
}
const hit = (q, arr) => !q || arr.some(v => String(v ?? "").toLowerCase().includes(q));
$("fCar").onchange = $("fMon").onchange = renderOps;
$("q").oninput = renderOps;
$("qc").oninput = () => renderCars();
$("qp").oninput = () => renderPlans();

// ---- العمليات ----
$("add").onclick = async () => {
  const amount = parseFloat($("amount").value);
  if (!amount || amount <= 0) { $("addMsg").textContent = "اكتب المبلغ"; return; }
  if (!$("desc").value.trim() && !$("vendor").value.trim()) { $("addMsg").textContent = "اكتب البيان أو الورشة"; return; }
  $("addMsg").textContent = "";
  try {
    await addDoc(collection(db, "users", uid, "entries"), {
      type: $("type").value, cat: $("cat").value, carId: $("car").value, amount,
      date: $("date").value || today(), km: parseInt($("km").value) || null,
      vendor: $("vendor").value.trim(), desc: $("desc").value.trim(), createdAt: serverTimestamp()
    });
    ["amount","km","vendor","desc"].forEach(i => $(i).value = "");
  } catch (e) { $("addMsg").textContent = em(e); }
};
function renderOps() {
  const fc = $("fCar").value, fm = $("fMon").value, q = $("q").value.trim().toLowerCase();
  const list = entries.filter(x => (fc === "all" || (fc === "none" ? !x.carId : x.carId === fc)) && (!fm || (x.date || "").startsWith(fm)) && hit(q, [x.cat, x.desc, x.vendor, carName(x.carId), x.date, x.amount, x.km]));
  let ti = 0, to = 0;
  list.forEach(x => x.type === "in" ? ti += x.amount : to += x.amount);
  $("tIn").textContent = fmt(ti); $("tOut").textContent = fmt(to);
  $("tNet").textContent = fmt(ti - to); $("tNet").className = ti - to >= 0 ? "in" : "out";
  $("opsList").innerHTML = list.length ? list.map(x => `<div class="it"><div><b>${esc(x.cat)}</b> ${esc(x.desc)}<small>${esc(x.date)} · ${esc(carName(x.carId))}${x.vendor ? " · " + esc(x.vendor) : ""}${x.km ? " · " + fmt(x.km) + " كم" : ""}</small></div>
    <div style="display:flex;align-items:center"><span class="amt ${x.type}">${x.type === "in" ? "+" : "−"}${fmt(x.amount)}</span><button class="x" data-del="entries/${x.id}" aria-label="حذف">✕</button></div></div>`).join("")
    : '<div class="empty">مفيش عمليات بالفلتر ده.</div>';
}

// ---- السيارات ----
$("addCar").onclick = async () => {
  if (!$("cName").value.trim()) { $("carMsg").textContent = "اكتب اسم السيارة"; return; }
  $("carMsg").textContent = "";
  try {
    await addDoc(collection(db, "users", uid, "cars"), {
      name: $("cName").value.trim(), plate: $("cPlate").value.trim(), price: parseFloat($("cPrice").value) || 0,
      boughtAt: $("cDate").value, driver: $("cDriver").value.trim(), note: $("cNote").value.trim(), createdAt: serverTimestamp()
    });
    ["cName","cPlate","cPrice","cDate","cDriver","cNote"].forEach(i => $(i).value = "");
  } catch (e) { $("carMsg").textContent = em(e); }
};
function renderCars() {
  const qc = $("qc").value.trim().toLowerCase();
  $("carList").innerHTML = cars.length ? cars.filter(c => hit(qc, [c.name, c.plate, c.driver, c.note])).map(c => {
    const es = entries.filter(x => x.carId === c.id);
    const inc = es.filter(x => x.type === "in").reduce((s, x) => s + x.amount, 0);
    const exp = es.filter(x => x.type === "out").reduce((s, x) => s + x.amount, 0);
    const mnt = es.filter(x => ["صيانة","قطع غيار","زيت وفلاتر","إطارات"].includes(x.cat)).reduce((s, x) => s + x.amount, 0);
    const lastKm = Math.max(0, ...es.map(x => x.km || 0));
    return `<div class="card click" data-open="${c.id}"><div class="top"><h2>${esc(c.name)} ${c.plate ? "· " + esc(c.plate) : ""}</h2><button class="x" data-del="cars/${c.id}" aria-label="حذف">✕</button></div>
      <div class="mute">${c.price ? "سعر الشراء " + fmt(c.price) : ""}${c.boughtAt ? " · " + esc(c.boughtAt) : ""}${c.driver ? " · السائق: " + esc(c.driver) : ""}${lastKm ? " · آخر عداد " + fmt(lastKm) + " كم" : ""}</div>
      ${c.note ? `<div class="mute">${esc(c.note)}</div>` : ""}
      <div class="sum" style="margin-top:10px"><div><small>الدخل</small><b class="in">${fmt(inc)}</b></div><div><small>المصروفات</small><b class="out">${fmt(exp)}</b></div><div><small>الصافي</small><b class="${inc - exp >= 0 ? "in" : "out"}">${fmt(inc - exp)}</b></div></div>
      <div class="mute" style="margin-top:8px">منها صيانة وقطع غيار: ${fmt(mnt)}</div><div class="mute" style="margin-top:4px">اضغط على الكارت لفتح كل التفاصيل</div></div>`;
  }).join("") : '<div class="card empty">ضيف أول سيارة من فوق.</div>';
}

// ---- صفحة السيارة ----
const dayName = d => { try { return new Date(d + "T12:00:00").toLocaleDateString("ar-EG", {weekday:"long", day:"numeric", month:"long"}); } catch { return d; } };
const monName = k => { try { return new Date(k + "-01T12:00:00").toLocaleDateString("ar-EG", {month:"long", year:"numeric"}); } catch { return k; } };
const netOf = a => a.reduce((s, x) => s + (x.type === "in" ? x.amount : -x.amount), 0);
const netTxt = n => `<b class="${n >= 0 ? "in" : "out"}">${n >= 0 ? "+" : "−"}${fmt(Math.abs(n))}</b>`;
const entryRow = x => `<div class="it"><div><b>${esc(x.cat)}</b> ${esc(x.desc)}<small>${[x.vendor, x.km ? fmt(x.km) + " كم" : ""].filter(Boolean).map(esc).join(" · ")}</small></div>
  <div style="display:flex;align-items:center"><span class="amt ${x.type}">${x.type === "in" ? "+" : "−"}${fmt(x.amount)}</span><button class="x" data-del="entries/${x.id}" aria-label="حذف">✕</button></div></div>`;
function planCard(p) {
  const done = p.paid >= p.count, due = nextDue(p), late = !done && due < today();
  return `<div class="card"><div class="top"><h2>${esc(p.title)}</h2><button class="x" data-del="plans/${p.id}" aria-label="حذف">✕</button></div>
    <div class="mute">القسط ${fmt(p.monthly)}</div><div class="bar"><i style="width:${Math.round(p.paid / p.count * 100)}%"></i></div>
    <div class="mute">اتدفع ${p.paid} من ${p.count} · المتبقي ${fmt((p.count - p.paid) * p.monthly)}</div>
    <div class="${late ? "out" : "mute"}" style="margin-top:4px">${done ? "القسط خلص ✓" : (late ? "متأخر! " : "القسط الجاي: ") + due}</div>
    <button class="full" data-pay="${p.id}" ${done ? "disabled" : ""}>سدّدت قسط (يتسجل كمصروف)</button></div>`;
}
function renderCar() {
  if (!curCar) return;
  const c = cars.find(x => x.id === curCar);
  if (!c) { curCar = null; showTab("cars"); return; }
  const m = $("cMon").value, q = $("cq").value.trim().toLowerCase();
  const mine = entries.filter(x => x.carId === c.id);
  const es = mine.filter(x => (!m || (x.date || "").startsWith(m)) && hit(q, [x.cat, x.desc, x.vendor, x.date, x.amount, x.km]));
  const allOut = mine.filter(x => x.type === "out").reduce((s, x) => s + x.amount, 0);
  const lastKm = Math.max(0, ...mine.map(x => x.km || 0));
  const cp = plans.filter(p => p.carId === c.id);
  const left = cp.reduce((s, p) => s + (p.count - p.paid) * p.monthly, 0);
  $("carHead").innerHTML = `<h2 class="s">${esc(c.name)} ${c.plate ? "· " + esc(c.plate) : ""}</h2>
    <div class="mute">${[c.price ? "سعر الشراء " + fmt(c.price) : "", c.boughtAt, c.driver ? "السائق: " + c.driver : "", lastKm ? "آخر عداد " + fmt(lastKm) + " كم" : ""].filter(Boolean).map(esc).join(" · ")}</div>
    ${c.note ? `<div class="mute">${esc(c.note)}</div>` : ""}
    <div class="mute" style="margin-top:6px">كل المصروفات من البداية: ${fmt(allOut)}${c.price ? " · التكلفة الكلية مع الشراء: " + fmt(allOut + c.price) : ""}${left ? " · أقساط متبقية: " + fmt(left) : ""}</div>
    <button class="full" data-addop="${c.id}">+ عملية جديدة لهذه السيارة</button>`;
  const ti = es.filter(x => x.type === "in").reduce((s, x) => s + x.amount, 0), to = es.filter(x => x.type === "out").reduce((s, x) => s + x.amount, 0);
  $("cIn").textContent = fmt(ti); $("cOut").textContent = fmt(to);
  $("cNet").textContent = fmt(ti - to); $("cNet").className = ti - to >= 0 ? "in" : "out";
  const cat = t => { const o = {}; es.filter(x => x.type === t).forEach(x => o[x.cat] = (o[x.cat] || 0) + x.amount); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const co = cat("out"), ci = cat("in"), rows = (a, t) => a.map(([k, v]) => `<div class="it"><span>${esc(k)}</span><span class="amt ${t}">${fmt(v)}</span></div>`).join("");
  $("carCats").classList.toggle("hide", !co.length && !ci.length);
  $("carCats").innerHTML = (co.length ? '<h2 class="s">المصروفات حسب التصنيف</h2>' + rows(co, "out") : "") + (ci.length ? '<h2 class="s" style="margin-top:12px">الدخل حسب التصنيف</h2>' + rows(ci, "in") : "");
  $("carPlans").innerHTML = cp.length ? '<h2 class="s">أقساط السيارة</h2>' + cp.map(planCard).join("") : "";
  const byM = {};
  es.forEach(x => { const k = (x.date || "").slice(0, 7); (byM[k] = byM[k] || []).push(x); });
  $("carOps").innerHTML = es.length ? Object.keys(byM).sort().reverse().map(k => {
    const byD = {};
    byM[k].forEach(x => { (byD[x.date] = byD[x.date] || []).push(x); });
    return `<div class="mh"><span>${monName(k)}</span>${netTxt(netOf(byM[k]))}</div>` + Object.keys(byD).sort().reverse().map(d =>
      `<div class="mute" style="margin-top:8px;display:flex;justify-content:space-between"><span>${dayName(d)}</span>${netTxt(netOf(byD[d]))}</div>` + byD[d].map(entryRow).join("")).join("");
  }).join("") : '<div class="empty">مفيش عمليات لهذه السيارة بالفلتر ده.</div>';
}

// ---- الأقساط ----
$("addPlan").onclick = async () => {
  const monthly = parseFloat($("pMonthly").value), count = parseInt($("pCount").value);
  if (!$("pTitle").value.trim() || !monthly || !count) { $("planMsg").textContent = "اكتب الاسم والقسط الشهري وعدد الأقساط"; return; }
  $("planMsg").textContent = "";
  try {
    await addDoc(collection(db, "users", uid, "plans"), {
      title: $("pTitle").value.trim(), carId: $("pCar").value, monthly, count,
      start: $("pStart").value || today(), paid: Math.min(parseInt($("pPaid").value) || 0, count), createdAt: serverTimestamp()
    });
    ["pTitle","pMonthly","pCount"].forEach(i => $(i).value = ""); $("pPaid").value = 0;
  } catch (e) { $("planMsg").textContent = em(e); }
};
function nextDue(p) { const d = new Date(p.start); d.setMonth(d.getMonth() + p.paid); return d.toISOString().slice(0, 10); }
function renderPlans() {
  const qp = $("qp").value.trim().toLowerCase();
  $("planList").innerHTML = plans.length ? plans.filter(p => hit(qp, [p.title, carName(p.carId), p.monthly])).map(p => {
    const done = p.paid >= p.count, due = nextDue(p), late = !done && due < today();
    return `<div class="card"><div class="top"><h2>${esc(p.title)}</h2><button class="x" data-del="plans/${p.id}" aria-label="حذف">✕</button></div>
      <div class="mute">${esc(carName(p.carId))} · القسط ${fmt(p.monthly)}</div>
      <div class="bar"><i style="width:${Math.round(p.paid / p.count * 100)}%"></i></div>
      <div class="mute">اتدفع ${p.paid} من ${p.count} · المتبقي ${fmt((p.count - p.paid) * p.monthly)}</div>
      <div class="${late ? "out" : "mute"}" style="margin-top:4px">${done ? "القسط خلص ✓" : (late ? "متأخر! " : "القسط الجاي: ") + due}</div>
      <button class="full" data-pay="${p.id}" ${done ? "disabled" : ""}>سدّدت قسط (يتسجل كمصروف)</button></div>`;
  }).join("") : '<div class="card empty">مفيش أقساط مسجلة.</div>';
}
document.addEventListener("click", async e => {
  const t = e.target;
  const o = t.closest("[data-open]");
  if (o && !t.dataset.del) { curCar = o.dataset.open; $("cMon").value = ""; $("cq").value = ""; showTab("car", "cars"); renderCar(); window.scrollTo(0, 0); return; }
  if (t.dataset.addop) { curCar = null; showTab("ops"); $("car").value = t.dataset.addop; window.scrollTo(0, 0); return; }
  try {
    if (t.dataset.del && confirm("متأكد من الحذف؟")) { const [c, id] = t.dataset.del.split("/"); await deleteDoc(doc(db, "users", uid, c, id)); }
    if (t.dataset.pay) {
      const p = plans.find(x => x.id === t.dataset.pay); if (!p || p.paid >= p.count) return;
      await addDoc(collection(db, "users", uid, "entries"), { type: "out", cat: "أقساط", carId: p.carId, amount: p.monthly, date: today(), km: null, vendor: "", desc: p.title + " - قسط " + (p.paid + 1) + " من " + p.count, createdAt: serverTimestamp() });
      await updateDoc(doc(db, "users", uid, "plans", p.id), { paid: increment(1) });
    }
  } catch (err) { alert(em(err)); }
});

// ---- تحميل البيانات ----
const all = () => { fillCarSelects(); renderOps(); renderCars(); renderPlans(); renderCar(); };
onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  if (!user) { uid = null; $("app").classList.add("hide"); $("authBox").classList.remove("hide"); return; }
  uid = user.uid; $("who").textContent = user.email;
  $("authBox").classList.add("hide"); $("app").classList.remove("hide");
  fillCats(); $("date").value = today(); $("pStart").value = today();
  const watch = (name, order, set) => onSnapshot(order ? query(collection(db, "users", uid, name), orderBy(order, "desc")) : collection(db, "users", uid, name),
    s => { set(s.docs.map(d => ({ id: d.id, ...d.data() }))); all(); }, err => { $("addMsg").textContent = em(err); });
  unsubs = [watch("cars", null, v => cars = v.sort((a, b) => a.name.localeCompare(b.name, "ar"))), watch("entries", "date", v => entries = v), watch("plans", null, v => plans = v)];
});
</script>
